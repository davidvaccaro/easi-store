name: Portable candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Actual platform
        id: platform
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'name='+process.platform+'-'+process.arch+'\n')"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run artifact:pack -- --bundle-runtime --node-version 24.22.1
      - run: node scripts/package-smoke.mjs --latest
      - uses: actions/upload-artifact@v4
        with:
          name: easi-store-${{ steps.platform.outputs.name }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
