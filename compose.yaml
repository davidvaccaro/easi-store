name: easi-store
services:
  store:
    build: .
    image: easi-store:0.1.0-preview
    init: true
    ports:
      - "127.0.0.1:8048:8048"
      - "127.0.0.1:4248:4248"
    volumes:
      - archive:/data
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  archive:
